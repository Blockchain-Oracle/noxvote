<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NoxVote README banner</title>
    <style>
      @font-face {
        font-family: "Sofia Sans";
        src: url("../../packages/ui/src/fonts/sofia-sans-variable.woff2")
          format("woff2");
      }

      @font-face {
        font-family: "JetBrains Mono";
        src: url("../../packages/ui/src/fonts/jetbrains-mono-variable.woff2")
          format("woff2");
      }

      :root {
        --canvas: #f3f0ee;
        --lifted: #fcfbfa;
        --ink: #141413;
        --slate: #696969;
        --dust: #d1cdc7;
        --ember: #c04a1e;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 1920px;
        height: 520px;
        margin: 0;
        overflow: hidden;
        background: var(--canvas);
        color: var(--ink);
      }

      body {
        font-family: "Sofia Sans", sans-serif;
      }

      main {
        position: relative;
        display: grid;
        grid-template-columns: 760px 1fr;
        width: 100%;
        height: 100%;
        border: 1px solid var(--dust);
        background: linear-gradient(
          115deg,
          var(--lifted) 0%,
          var(--canvas) 72%
        );
      }

      .identity {
        display: grid;
        place-items: center;
        border-right: 1px solid var(--dust);
      }

      .lockup {
        display: flex;
        flex-direction: column;
        align-items: center;
        transform: translateY(-2px);
      }

      .lockup img {
        width: 166px;
        height: 166px;
      }

      .wordmark {
        margin-top: 18px;
        font-size: 62px;
        font-weight: 590;
        letter-spacing: 0.24em;
        line-height: 1;
        text-transform: uppercase;
      }

      .descriptor,
      .built {
        font-family: "JetBrains Mono", monospace;
        text-transform: uppercase;
      }

      .descriptor {
        margin-top: 20px;
        color: var(--slate);
        font-size: 16px;
        font-weight: 560;
        letter-spacing: 0.15em;
      }

      .built {
        margin-top: 9px;
        font-size: 13px;
        font-weight: 650;
        letter-spacing: 0.12em;
      }

      .promise {
        position: relative;
        display: flex;
        flex-direction: column;
        justify-content: center;
        overflow: hidden;
        padding: 48px 82px;
      }

      .eyebrow {
        font:
          620 15px/1 "JetBrains Mono",
          monospace;
        letter-spacing: 0.13em;
        text-transform: uppercase;
      }

      h1 {
        z-index: 2;
        max-width: 930px;
        margin: 20px 0 0;
        font-size: 88px;
        font-weight: 730;
        letter-spacing: -0.055em;
        line-height: 0.9;
        text-transform: uppercase;
      }

      .evidence {
        z-index: 2;
        margin-top: 30px;
        color: var(--slate);
        font:
          580 14px/1 "JetBrains Mono",
          monospace;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .orbit {
        position: absolute;
        top: -230px;
        right: -135px;
        width: 610px;
        height: 610px;
        border: 2px solid var(--dust);
        border-radius: 50%;
      }

      .orbit::after {
        position: absolute;
        right: 110px;
        bottom: 28px;
        width: 42px;
        height: 42px;
        border-radius: 50%;
        background: var(--ember);
        content: "";
      }

      .grain {
        position: absolute;
        inset: 0;
        opacity: 0.12;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.78' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.12'/%3E%3C/svg%3E");
        pointer-events: none;
        mix-blend-mode: multiply;
      }
    </style>
  </head>
  <body>
    <main>
      <section class="identity">
        <div class="lockup">
          <img src="../brand/noxvote-mark.svg" alt="" />
          <div class="wordmark">NoxVote</div>
          <div class="descriptor">Confidential DAO governance</div>
          <div class="built">Built with iExec Nox</div>
        </div>
      </section>
      <section class="promise">
        <div class="eyebrow">The privacy destination</div>
        <h1>Where private DAO lives.</h1>
        <div class="evidence">
          Safe + Governor · Outcome-only verdicts · Live on Sepolia
        </div>
        <div class="orbit"></div>
      </section>
      <div class="grain"></div>
    </main>
  </body>
</html>
